name: Build Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: Off Day.xcodeproj
  SCHEME: Off Day

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Show build environment
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Archive without Apple signing
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/Off Day.xcarchive"
          rm -rf "$archive_path" "$RUNNER_TEMP/ipa" "$GITHUB_WORKSPACE"/*.ipa

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            | tee "$RUNNER_TEMP/archive.log"

      - name: Package IPA
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/Off Day.xcarchive/Products/Applications/Off Day.app"
          test -d "$app_path"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/ipa/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/ipa/Payload" \
            "$GITHUB_WORKSPACE/Off-Day-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Off-Day-unsigned-ipa
          path: Off-Day-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
